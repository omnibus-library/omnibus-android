name: Testing

# Both jobs run on every PR, whatever its base branch, so a stacked PR gets CI
# from the start. The jobs are the required status checks and must never be
# skipped: a required check that doesn't report blocks the merge forever.
# Runs on main as well, to catch what the PR runs missed after a merge.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        working-directory: omnibus
        run: ./gradlew test --stacktrace

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: omnibus/app/build/reports/tests/
          if-no-files-found: ignore

  instrumentation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Refresh cmdline-tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install "cmdline-tools;latest"
          if [ -d "$SDK/cmdline-tools/latest-2" ]; then
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/latest-2" "$SDK/cmdline-tools/latest"
          fi

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: "37.0"
          target: google_apis_ps16k
          arch: x86_64
          emulator-boot-timeout: 1200
          disable-animations: true
          working-directory: omnibus
          script: ./gradlew connectedAndroidTest --stacktrace

      - name: Upload instrumentation test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports
          path: |
            omnibus/app/build/reports/androidTests/
            omnibus/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
