name: CI Tests Comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    if: |
      github.event.issue.pull_request && (github.event.comment.body == 'ci test' || github.event.comment.body == 'ci tests' || github.event.comment.body == format('ci test{0}', fromJSON('"\n"')) || github.event.comment.body == format('ci tests{0}', fromJSON('"\n"')))
    outputs:
      proceed: ${{ steps.auth.outputs.proceed }}
      head_sha: ${{ steps.auth.outputs.head_sha }}
    steps:
      - id: auth
        uses: actions/github-script@v9
        with:
          script: |
            const comment = context.payload.comment || {};
            const body = String(comment.body || '').trim();
            if (body !== 'ci test' && body !== 'ci tests') {
              return;
            }
            const association = comment.author_association;
            if (
              association !== 'OWNER' &&
              association !== 'MEMBER' &&
              association !== 'COLLABORATOR'
            ) {
              core.notice(
                'CI tests were not started because the comment author is not an owner, member, or collaborator.'
              );
              return;
            }
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pr.data.base.ref !== 'main' || pr.data.state !== 'open') {
              core.notice(
                'CI tests were not started because the pull request is not open against main.'
              );
              return;
            }
            core.setOutput('proceed', 'true');
            core.setOutput('head_sha', pr.data.head.sha);

  tests:
    needs: authorize
    if: needs.authorize.outputs.proceed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/android-tests.yml
    with:
      head_sha: ${{ needs.authorize.outputs.head_sha }}

  verdict:
    needs: [authorize, tests]
    if: always() && needs.authorize.outputs.proceed == 'true' && needs.tests.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const headSha = '${{ needs.authorize.outputs.head_sha }}';
            const unit = '${{ needs.tests.outputs.unit }}';
            const instrumentation = '${{ needs.tests.outputs.instrumentation }}';
            const passed = unit === 'success' && instrumentation === 'success';
            const title = passed ? 'CI Tests: passed' : 'CI Tests: failed';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'CI Tests / verdict',
              head_sha: headSha,
              status: 'completed',
              conclusion: passed ? 'success' : 'failure',
              output: {
                title,
                summary: `unit: ${unit}\ninstrumentation: ${instrumentation}`,
              },
            });
            if (!passed) {
              core.setFailed(title);
            }
