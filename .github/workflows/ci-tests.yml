name: CI Tests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/android-tests.yml
    with:
      head_sha: ${{ github.event.pull_request.head.sha }}
