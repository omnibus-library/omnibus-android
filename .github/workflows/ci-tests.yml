name: CI Tests

on:
  pull_request_target:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event.action == 'opened'
    permissions:
      contents: read
    uses: ./.github/workflows/android-tests.yml
    with:
      head_sha: ${{ github.event.pull_request.head.sha }}

  verdict:
    name: verdict
    needs: [tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clear check on new commits
        if: github.event.action == 'synchronize'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### CI Tests: cleared
          New commits were pushed. Tests were not run.
          An owner, member, or collaborator can comment `ci test` or `ci tests` to run them on the current head.
          EOF
          exit 1

      - name: Report test verdict
        if: github.event.action == 'opened'
        run: |
          unit="${{ needs.tests.outputs.unit }}"
          instrumentation="${{ needs.tests.outputs.instrumentation }}"
          if [ "$unit" = "success" ] && [ "$instrumentation" = "success" ]; then
            echo "### CI Tests: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### CI Tests: failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "unit: $unit"
            echo "instrumentation: $instrumentation"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$unit" != "success" ] || [ "$instrumentation" != "success" ]; then
            exit 1
          fi
